name: Tests

on:
  pull_request:
  push:
    branches:
      - main
      - fix/to-date-jsf-viewstate-id-0.1.27

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install test dependencies
        run: python -m pip install pytest pytest-asyncio aiohttp beautifulsoup4==4.13.4
      - name: Compile changed integration modules
        run: |
          python -m py_compile \
            custom_components/linznetz_energy/__init__.py \
            custom_components/linznetz_energy/api.py \
            custom_components/linznetz_energy/assign_to_date_diagnostics.py \
            custom_components/linznetz_energy/assign_to_date_detail_diagnostics.py \
            custom_components/linznetz_energy/backfill.py \
            custom_components/linznetz_energy/browser_contract_client.py \
            custom_components/linznetz_energy/config_flow.py \
            custom_components/linznetz_energy/coordinator.py \
            custom_components/linznetz_energy/diagnostics.py \
            custom_components/linznetz_energy/date_contract_diagnostics.py \
            custom_components/linznetz_energy/inline_date_handler_diagnostics.py
      - name: Run regression tests
        run: pytest -q tests
