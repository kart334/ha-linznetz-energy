name: Tests

on:
  pull_request:
  push:
    branches:
      - main
      - fix/legacy-backfill-trigger-migration

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install test dependencies
        run: python -m pip install pytest aiohttp beautifulsoup4==4.13.4
      - name: Compile changed integration modules
        run: |
          python -m py_compile \
            custom_components/linznetz_energy/__init__.py \
            custom_components/linznetz_energy/api.py \
            custom_components/linznetz_energy/backfill.py \
            custom_components/linznetz_energy/config_flow.py \
            custom_components/linznetz_energy/coordinator.py
      - name: Run regression tests
        run: pytest -q tests/test_api_day_validation.py tests/test_backfill_state.py
